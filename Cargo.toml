[package]
name = "dayfly"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
description = "Ephemeral paste and file store for LLM agents, backed by S3-compatible object storage"
license = "MIT"
authors = ["suorcd"]
repository = "https://github.com/suorcd/dayfly"
homepage = "https://github.com/suorcd/dayfly"
keywords = ["pastebin", "s3", "mcp", "llm", "agents"]
categories = ["command-line-utilities"]

[[bin]]
name = "dayfly"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-s3 = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "multipart"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
infer = "0"
libc = "0.2"
mime_guess = "2"
percent-encoding = "2"
rand = "0.9"
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
